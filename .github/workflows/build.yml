name: Android APK CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools

          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
            unzip -q tools.zip
            mv cmdline-tools latest
          fi

          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/af/client
          mkdir -p app/src/main

          # settings.gradle
          printf 'pluginManagement {\n' > settings.gradle
          printf ' repositories { google(); mavenCentral(); gradlePluginPortal(); }\n' >> settings.gradle
          printf '}\n' >> settings.gradle

          printf 'dependencyResolutionManagement {\n' >> settings.gradle
          printf ' repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n' >> settings.gradle
          printf ' repositories { google(); mavenCentral(); }\n' >> settings.gradle
          printf '}\n' >> settings.gradle

          printf 'rootProject.name="af_client"\n' >> settings.gradle
          printf 'include ":app"\n' >> settings.gradle

          # root build.gradle
          printf "plugins {\n" > build.gradle
          printf " id 'com.android.application' version '8.1.0' apply false\n" >> build.gradle
          printf " id 'org.jetbrains.kotlin.android' version '1.9.0' apply false\n" >> build.gradle
          printf "}\n" >> build.gradle

          # app/build.gradle
          printf "plugins {\n" > app/build.gradle
          printf " id 'com.android.application'\n" >> app/build.gradle
          printf " id 'org.jetbrains.kotlin.android'\n" >> app/build.gradle
          printf "}\n" >> app/build.gradle

          printf "android {\n" >> app/build.gradle
          printf " namespace \"com.af.client\"\n" >> app/build.gradle
          printf " compileSdk 34\n" >> app/build.gradle

          printf " defaultConfig {\n" >> app/build.gradle
          printf "  applicationId \"com.af.client\"\n" >> app/build.gradle
          printf "  minSdk 24\n" >> app/build.gradle
          printf "  targetSdk 34\n" >> app/build.gradle
          printf "  versionCode 1\n" >> app/build.gradle
          printf "  versionName \"1.0\"\n" >> app/build.gradle
          printf " }\n" >> app/build.gradle

          printf " buildTypes { debug { minifyEnabled false } }\n" >> app/build.gradle

          printf " compileOptions {\n" >> app/build.gradle
          printf "  sourceCompatibility JavaVersion.VERSION_17\n" >> app/build.gradle
          printf "  targetCompatibility JavaVersion.VERSION_17\n" >> app/build.gradle
          printf " }\n" >> app/build.gradle

          printf " kotlinOptions { jvmTarget = \"17\" }\n" >> app/build.gradle

          printf "}\n" >> app/build.gradle
          printf "dependencies {}\n" >> app/build.gradle

          # Manifest
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' > app/src/main/AndroidManifest.xml
          printf '<uses-permission android:name="android.permission.INTERNET"/>\n' >> app/src/main/AndroidManifest.xml
          printf '<application android:label="AF Server" android:usesCleartextTraffic="true">\n' >> app/src/main/AndroidManifest.xml
          printf '<activity android:name=".MainActivity" android:exported="true">\n' >> app/src/main/AndroidManifest.xml
          printf '<intent-filter>\n' >> app/src/main/AndroidManifest.xml
          printf '<action android:name="android.intent.action.MAIN"/>\n' >> app/src/main/AndroidManifest.xml
          printf '<category android:name="android.intent.category.LAUNCHER"/>\n' >> app/src/main/AndroidManifest.xml
          printf '</intent-filter>\n' >> app/src/main/AndroidManifest.xml
          printf '</activity>\n' >> app/src/main/AndroidManifest.xml
          printf '</application>\n' >> app/src/main/AndroidManifest.xml
          printf '</manifest>\n' >> app/src/main/AndroidManifest.xml

          # Kotlin file
          FILE=app/src/main/java/com/af/client/MainActivity.kt

          printf "package com.af.client\n\n" > $FILE

          printf "import android.app.Activity\n" >> $FILE
          printf "import android.os.Bundle\n" >> $FILE
          printf "import android.widget.TextView\n" >> $FILE
          printf "import android.content.Context\n" >> $FILE
          printf "import android.net.wifi.WifiManager\n" >> $FILE
          printf "import android.os.BatteryManager\n" >> $FILE
          printf "import java.net.ServerSocket\n" >> $FILE
          printf "import java.net.Socket\n" >> $FILE
          printf "import kotlin.concurrent.thread\n\n" >> $FILE

          printf "class MainActivity : Activity() {\n" >> $FILE
          printf " lateinit var tv: TextView\n\n" >> $FILE

          printf " override fun onCreate(savedInstanceState: Bundle?) {\n" >> $FILE
          printf "  super.onCreate(savedInstanceState)\n" >> $FILE
          printf "  tv = TextView(this)\n" >> $FILE
          printf "  tv.text = \"Server running on 8080\"\n" >> $FILE
          printf "  setContentView(tv)\n\n" >> $FILE
          printf "  startServer()\n" >> $FILE
          printf " }\n\n" >> $FILE

          printf " private fun startServer() {\n" >> $FILE
          printf "  thread {\n" >> $FILE
          printf "   val server = ServerSocket(8080)\n" >> $FILE
          printf "   while (true) {\n" >> $FILE
          printf "    val client = server.accept()\n" >> $FILE
          printf "    handle(client)\n" >> $FILE
          printf "   }\n" >> $FILE
          printf "  }\n" >> $FILE
          printf " }\n\n" >> $FILE

          printf " private fun handle(socket: Socket) {\n" >> $FILE
          printf "  thread {\n" >> $FILE
          printf "   val input = socket.getInputStream().bufferedReader()\n" >> $FILE
          printf "   val output = socket.getOutputStream()\n\n" >> $FILE

          printf "   val line = input.readLine() ?: return@thread\n" >> $FILE
          printf "   val cmd = line.substringAfter(\"cmd=\").substringBefore(\" \")\n\n" >> $FILE

          printf "   val result = when(cmd) {\n" >> $FILE
          printf "    \"battery\" -> getBattery()\n" >> $FILE
          printf "    \"wifi\" -> getWifi()\n" >> $FILE
          printf "    else -> \"unknown command\"\n" >> $FILE
          printf "   }\n\n" >> $FILE

          # 🔥 FIX: response теперь правильно записывается
          printf "   val response = \"HTTP/1.1 200 OK\\r\\n\\r\\n\" + result\n" >> $FILE
          printf "   output.write(response.toByteArray())\n" >> $FILE
          printf "   output.flush()\n" >> $FILE
          printf "   socket.close()\n" >> $FILE
          printf "  }\n" >> $FILE
          printf " }\n\n" >> $FILE

          printf " private fun getBattery(): String {\n" >> $FILE
          printf "  val bm = getSystemService(BATTERY_SERVICE) as BatteryManager\n" >> $FILE
          printf "  val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)\n" >> $FILE
          printf "  return \"Battery: \$level%%\"\n" >> $FILE
          printf " }\n\n" >> $FILE

          printf " private fun getWifi(): String {\n" >> $FILE
          printf "  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager\n" >> $FILE
          printf "  return if (wm.isWifiEnabled) \"WiFi ON\" else \"WiFi OFF\"\n" >> $FILE
          printf " }\n\n" >> $FILE

          printf "}\n" >> $FILE

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Setup Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

          curl -L https://services.gradle.org/distributions/gradle-8.3-bin.zip -o gradle.zip
          unzip -q gradle.zip
          mv gradle-8.3 gradle
          chmod +x gradle/bin/gradle

      - name: Build APK
        run: |
          ./gradle/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
