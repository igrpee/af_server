plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.af.client"
    compileSdk 34

    defaultConfig {
        applicationId "com.af.client"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}
dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    // implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-scripting-common:1.9.0"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jvm-host:1.9.0"
}
